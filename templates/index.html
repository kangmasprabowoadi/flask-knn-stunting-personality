<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Prediksi Cerdas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            /* Background Lanskap Gunung Bromo, Indonesia */
            background-image: url('https://images.unsplash.com/photo-1588668214407-6ea9a6d8c272?q=80&w=2071&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden; 
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0; 
        }
        .glass-portal {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .glass-side {
            background: rgba(79, 70, 229, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 relative">

    <div id="loading-screen" class="fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center transition-opacity duration-700">
        <div class="relative flex items-center justify-center">
            <div class="absolute w-28 h-28 border-4 border-transparent border-t-indigo-500 border-b-emerald-500 rounded-full animate-spin"></div>
            <div class="w-20 h-20 bg-slate-900 rounded-full shadow-lg flex items-center justify-center animate-pulse">
                <i data-lucide="cpu" class="w-10 h-10 text-indigo-400"></i>
            </div>
        </div>
        <h2 class="mt-8 text-sm font-bold text-indigo-400 tracking-[0.3em] uppercase animate-pulse">Menyiapkan Engine AI...</h2>
    </div>

    <div id="main-content" class="max-w-5xl w-full glass-portal rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col md:flex-row min-h-[600px] hidden animate-fade-in-up">
        
        <div class="w-full md:w-1/2 p-12 flex flex-col justify-center relative overflow-hidden glass-side text-white">
            <div class="relative z-10">
                <div class="w-16 h-16 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center mb-8 border border-white/30 shadow-inner">
                    <i data-lucide="sparkles" class="w-8 h-8 text-white animate-pulse"></i>
                </div>
                <h1 class="text-4xl lg:text-5xl font-black leading-tight mb-4">
                    Portal<br><span class="text-indigo-200">Prediksi Cerdas</span>
                </h1>
                <p class="text-indigo-50 leading-relaxed font-medium text-lg opacity-90">
                    Sistem klasifikasi cerdas berbasis Machine Learning. Pilih modul kecerdasan buatan yang ingin Anda gunakan.
                </p>
            </div>
        </div>

        <div class="w-full md:w-1/2 p-8 lg:p-12 flex flex-col justify-center space-y-6 bg-white/10 backdrop-blur-sm">
            
            <a href="/stunting" class="group block p-6 bg-white/60 hover:bg-white/90 border border-white/40 rounded-2xl shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                <div class="flex items-center space-x-5">
                    <div class="w-16 h-16 bg-emerald-500 text-white rounded-2xl flex items-center justify-center shadow-md group-hover:scale-105 transition-transform">
                        <i data-lucide="activity" class="w-8 h-8"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-extrabold text-slate-800">Deteksi Stunting</h2>
                        <p class="text-sm text-slate-600 mt-1 font-medium">Evaluasi metrik gizi dan tumbuh kembang balita.</p>
                    </div>
                    <i data-lucide="arrow-right" class="w-6 h-6 text-slate-400 ml-auto group-hover:text-emerald-600 group-hover:translate-x-1 transition-all"></i>
                </div>
            </a>

            <a href="/personality" class="group block p-6 bg-white/60 hover:bg-white/90 border border-white/40 rounded-2xl shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                <div class="flex items-center space-x-5">
                    <div class="w-16 h-16 bg-indigo-600 text-white rounded-2xl flex items-center justify-center shadow-md group-hover:scale-105 transition-transform">
                        <i data-lucide="brain-circuit" class="w-8 h-8"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-extrabold text-slate-800">Analisis Kepribadian</h2>
                        <p class="text-sm text-slate-600 mt-1 font-medium">Klasifikasi psikologi kelompok sosial harian.</p>
                    </div>
                    <i data-lucide="arrow-right" class="w-6 h-6 text-slate-400 ml-auto group-hover:text-indigo-600 group-hover:translate-x-1 transition-all"></i>
                </div>
            </a>

        </div>
    </div>

    <script>
        lucide.createIcons();
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const loadingScreen = document.getElementById('loading-screen');
                const mainContent = document.getElementById('main-content');
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                    mainContent.classList.remove('hidden');
                    document.body.style.overflow = 'auto';
                }, 700);
            }, 1200);
        });
    </script>
</body>
</html>
